version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      expo:
        patterns:
          ["expo", "expo-*", "@expo/*", "react-native", "react-native-*"]
        update-types: ["patch", "minor"]
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Tokyo
