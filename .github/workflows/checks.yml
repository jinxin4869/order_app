name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run test:audit
      - run: npm run audit:dependencies
        env:
          ORDER_APP_AUDIT_ARTIFACTS: ${{ runner.temp }}/order-app-audit
      - run: npm run test:sdk
      - run: npm run lint
      - run: npm run lint --prefix functions
      - run: npm run test:all
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      - run: npm run test:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
        env:
          ORDER_APP_WEB_ARTIFACTS: ${{ runner.temp }}/order-app-web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/order-app-web
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/order-app-audit
          if-no-files-found: ignore
