name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run test:audit
      - run: npm run audit:dependencies
        env:
          ORDER_APP_AUDIT_ARTIFACTS: ${{ runner.temp }}/order-app-audit
      - run: npm run test:sdk
      - run: npm run lint
      - run: npm run lint --prefix functions
      - run: npm run test:all
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      - run: npm run test:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
        env:
          ORDER_APP_WEB_ARTIFACTS: ${{ runner.temp }}/order-app-web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/order-app-web
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audit
          path: ${{ runner.temp }}/order-app-audit
          if-no-files-found: ignore
